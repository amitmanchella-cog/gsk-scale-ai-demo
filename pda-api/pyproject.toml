[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pda-api"
version = "1.0.0"
description = "Protocol Design Advisor API: extraction, benchmark assessment, forecast and report"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pyarrow>=17",
    "numpy>=1.26",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "reportlab>=4.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "pypdf>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["pda_api", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=pda_api --cov-report=term-missing --cov-fail-under=85"
