name: Deploy navigator (non-prod)

# No cloud target exists for this demo, so "deploying" means building the Field Force Navigator image and
# pushing it to GHCR; the GitHub Environment "non-prod" gates the push behind a required reviewer.
# Pushes to main publish :non-prod; pull requests publish :pr-<n> so the gate can be exercised before merge.
on:
  push:
    branches: [main]
    paths: ["apps/navigator/**", ".github/workflows/deploy-navigator.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/navigator/**", ".github/workflows/deploy-navigator.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/navigator

jobs:
  build:
    name: Build image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/navigator/Dockerfile
          load: true
          tags: navigator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --rm -p 8000:8000 --name navigator navigator:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done
          curl -fsS http://localhost:8000/health | tee health.json
          curl -fsS http://localhost:8000/api/reps | head -c 300
          docker stop navigator
      - name: Save image
        run: docker save navigator:ci | gzip > navigator-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: navigator-image
          path: navigator-image.tar.gz
          retention-days: 1

  deploy-non-prod:
    name: Push to GHCR (non-prod)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: non-prod
      url: https://github.com/${{ github.repository }}/pkgs/container/gsk-scale-ai-demo%2Fnavigator
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: navigator-image
      - run: docker load < navigator-image.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"; TAG="pr-${{ github.event.pull_request.number }}"
          else
            SHA="$GITHUB_SHA"; TAG="non-prod"
          fi
          SHORT=${SHA::7}
          docker tag navigator:ci "$IMAGE:$SHORT"
          docker tag navigator:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$SHORT"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$SHORT and $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
