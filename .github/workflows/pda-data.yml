name: pda-data

on:
  pull_request:
    paths:
      - "pda-data/**"
      - ".github/workflows/pda-data.yml"
  push:
    branches: [main]
    paths:
      - "pda-data/**"
      - ".github/workflows/pda-data.yml"

permissions:
  contents: read

concurrency:
  group: pda-data-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pda-data

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pda-data/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip "setuptools>=84.1" && make install
      - name: Lint (ruff)
        run: make lint
      - name: Type check (mypy)
        run: make typecheck
      - name: Unit tests with coverage (local SparkSession)
        run: pytest --cov-report=xml
      - name: Run the pipeline on the committed snapshot
        run: make run && cat output/v1/_MANIFEST.json
      - name: Dependency audit (pip-audit)
        run: make audit
      - name: SBOM (CycloneDX)
        run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: pda-data-sbom
          path: pda-data/sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: pda-data-coverage
          path: pda-data/coverage.xml
