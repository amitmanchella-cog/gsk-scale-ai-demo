name: pda-web

on:
  pull_request:
    paths:
      - "pda-web/**"
      - ".github/workflows/pda-web.yml"
  push:
    branches: [main]
    paths:
      - "pda-web/**"
      - ".github/workflows/pda-web.yml"

permissions:
  contents: read

concurrency:
  group: pda-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pda-web

jobs:
  web-check:
    name: web-check (lint, types, unit tests, audit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pda-web/package-lock.json
      - run: npm ci
      - name: Lint (eslint, prettier)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit tests with coverage (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: pda-web-sbom
          path: pda-web/sbom.json

  web-e2e:
    name: web-e2e (Playwright: chromium, firefox, webkit, iPhone 14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pda-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pda-api/pyproject.toml
      - name: Install the API the suite runs against
        run: python -m pip install --upgrade pip && python -m pip install -e ../pda-api
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps
      - name: End-to-end tests on all engines
        run: npm run e2e
        env:
          PDA_API_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pda-web-playwright-report
          path: pda-web/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pda-web-playwright-results
          path: pda-web/test-results
          retention-days: 14
