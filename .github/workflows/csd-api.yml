name: csd-api

on:
  pull_request:
    paths:
      - "csd-api/**"
      - "csd-core/**"
      - ".github/workflows/csd-api.yml"
  push:
    branches: [main]
    paths:
      - "csd-api/**"
      - "csd-core/**"
      - ".github/workflows/csd-api.yml"

permissions:
  contents: read

concurrency:
  group: csd-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: csd-api (ruff, mypy, pytest, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csd-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: csd-api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ../csd-core -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Unit and property tests with coverage
        run: pytest
      - name: Dependency audit (pip-audit)
        run: pip-audit --skip-editable
