[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"notebooks/_build_notebooks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["data/tests", "pipelines", "services", "apps"]
addopts = "-q"
