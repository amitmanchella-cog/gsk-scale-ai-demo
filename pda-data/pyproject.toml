[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pda-data"
version = "1.0.0"
description = "PySpark benchmark dataset pipeline for the Protocol Design Advisor"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.8",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pda_data"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pda_data --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["pda_data"]
